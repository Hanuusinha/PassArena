server:
  port: 9091

spring:
    application:
      name: movie-service
    datasource:
        url: ${MOVIEDB_URL}
        username: ${MOVIEDB_USERNAME}
        password: ${MOVIEDB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
        ddl-auto: update
    show-sql: true